[pytest]
# Configuración de pytest para Backend Farmacia

# Directorios donde buscar tests
testpaths = app/tests

# Directorio raíz del proyecto (donde está main.py)
# Esto asegura que pytest pueda importar 'main' y 'app'
pythonpath = .

# Patrón de archivos de test
python_files = test_*.py

# Patrón de clases de test
python_classes = Test*

# Patrón de funciones de test
python_functions = test_*

# Opciones por defecto
addopts =
    -v
    --strict-markers
    --tb=short
    -W default

# Marcadores personalizados
markers =
    slow: marca tests que son lentos
    integration: tests de integración con Profit
    auth: tests de autenticación
    articles: tests de artículos
    quotes: tests de cotizaciones
    admin: tests de administrador
    
# Variables de entorno
env_files =
    .env.test
