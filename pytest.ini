[pytest]
# Configuración de pytest para Backend Farmacia

# Directorios donde buscar tests
testpaths = app/tests

# Directorio raíz del proyecto (donde está main.py)
# Esto asegura que pytest pueda importar 'main' y 'app'
pythonpath = .

# Patrón de archivos de test
python_files = test_*.py

# Patrón de clases de test
python_classes = Test*

# Patrón de funciones de test
python_functions = test_*

# Opciones por defecto
addopts =
    -v
    --strict-markers
    --tb=short
    -W default

# Marcadores personalizados
markers =
    slow: marca tests que son lentos
    integration: tests de integración con Profit
    unit: tests unitarios aislados
    auth: tests de autenticación
    articles: tests de artículos
    quotes: tests de cotizaciones
    admin: tests de administrador
    cache: tests del sistema de cache (memory/redis)
    redis: tests que requieren un servidor Redis real (se saltean si no está)

# pytest-asyncio: los tests async se detectan implícitamente (modo auto)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Variables de entorno
env_files =
    .env.test
