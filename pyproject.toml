[project]
name = "backend-farmacia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.16.4",
    "bcrypt==3.2.0",
    "cloudinary>=1.46.3",
    "email-validator>=2.2.0",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "numpy>=2.3.2",
    "openpyxl>=3.1.5",
    "orjson>=3.13.0",
    "pandas>=2.3.2",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=12.0.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "pyjwt[crypto]>=2.13.0",
    "pymssql>=2.3.8",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "python-decouple>=3.8",
    "pyjwt[crypto]>=2.8",
    "python-multipart>=0.0.20",
    "redis>=5.0.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.41",
    "uvicorn>=0.35.0",
    "vulture>=2.14",
    "xlrd>=2.0.2",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.5",
    "pytest-cov>=7.0",
    "fakeredis>=2.40.0",
    "pytest-env>=1.8.1",
]

[project.optional-dependencies]
# CI runs `pip install -e ".[dev,test]"` (deploy-backend.yml test job).
dev = ["mypy>=2.4", "ruff>=0.16"]
test = ["pytest-cov>=7.0"]

[tool.setuptools]
packages = ["app"]

[tool.mypy]
python_version = "3.12"
# CI runs `pip install mypy` and then `mypy app/ --ignore-missing-imports`
# (no project dependencies installed), so every third-party import resolves to
# Any. ``no_site_packages`` reproduces that behavior locally, making type-check
# results consistent between dev environments and CI regardless of the local venv.
no_site_packages = true

[tool.ruff]
# Keep the CI contract: `ruff check app/` and `ruff format --check app/`.
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Classic core rules (E4xx/E7xx/E9xx + pyflakes). Newer ruff versions enable many
# more rules by default (B, BLE, S, SIM, RUF, ...) that would fail this legacy
# codebase wholesale; selecting explicitly keeps lint results stable across
# ruff upgrades instead of relying on the tool's evolving default set.
select = ["E4", "E7", "E9", "F"]
ignore = [
    # Legacy note: both are recurring idioms in this FastAPI/SQLAlchemy codebase.
    "E712",  # SQLAlchemy filters legitimately use `Model.col == True`; rewording would change SQL semantics.
    "E402",  # Several modules import after module-level setup on purpose (e.g. to avoid circular imports).
]

[tool.ruff.format]
quote-style = "double"
